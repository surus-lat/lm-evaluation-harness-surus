dataset_path: Helsinki-NLP/opus-100
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
fewshot_split: train
generation_kwargs:
  until:
    - "<|endoftext|>"
    - "</s>"
    - "\n\nTranslate"
    - "\n\nEnglish"
    - "\n\nSpanish"
    - "\n\n\""
  do_sample: false
  temperature: 0.0
  max_gen_toks: 100
filter_list:
  - name: "clean_translation"
    filter:
      - function: "regex"
        regex_pattern: "(.+?)(?:\\n|$)"
      - function: "take_first"
metric_list:
  - metric: bleu
    aggregation: bleu
    higher_is_better: true
  - metric: ter
    aggregation: ter
    higher_is_better: false
  - metric: chrf
    aggregation: chrf
    higher_is_better: true
metadata:
  version: 1.0
