dataset_path: openlanguagedata/flores_plus
dataset_name: spa_Latn
output_type: generate_until
# Using dev and devtest splits as per FLORES+ documentation
training_split: dev
validation_split: dev
test_split: devtest
fewshot_split: dev
generation_kwargs:
  until:
    - "<|endoftext|>"
    - "<|end|>"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: bleu
    aggregation: bleu
    higher_is_better: true
  - metric: ter
    aggregation: ter
    higher_is_better: false
  - metric: chrf
    aggregation: chrf
    higher_is_better: true
metadata:
  version: 1.0
